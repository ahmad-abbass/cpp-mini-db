name: C++ CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-debug-sanitizers
            compiler: g++
            build_type: Debug
            sanitizers: "ON"
            fuzzer: "OFF"
          - name: gcc-release
            compiler: g++
            build_type: Release
            sanitizers: "OFF"
            fuzzer: "OFF"
          - name: clang-debug-sanitizers
            compiler: clang++
            build_type: Debug
            sanitizers: "ON"
            fuzzer: "ON"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DMINIDB_ENABLE_SANITIZERS=${{ matrix.sanitizers }}
          -DMINIDB_BUILD_FUZZER=${{ matrix.fuzzer }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      - name: Fuzz WAL decoder
        if: matrix.fuzzer == 'ON'
        run: ./build/wal_fuzzer -max_total_time=10 -max_len=4096 -timeout=2
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
